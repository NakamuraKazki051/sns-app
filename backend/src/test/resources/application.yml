spring:
  # テストは Docker 無しで動くよう H2 を使う。IGNORECASE で MySQL の照合順序(大文字・小文字を区別しない)に合わせる
  datasource:
    url: jdbc:h2:mem:snsapp;MODE=MySQL;DATABASE_TO_LOWER=TRUE;IGNORECASE=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  # 本番と同じく Flyway の SQL でテーブルを作り、エンティティとずれていないかを validate で確かめる
  flyway:
    placeholders:
      icon_data_type: VARBINARY(1048576)
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
