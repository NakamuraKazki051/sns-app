spring:
  application:
    name: sns-api
  # ローカルはリポジトリ直下の docker-compose.yml の MySQL(localhost:3307)。本番は環境変数で上書きする
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/snsapp_development}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:snsapp}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: 8080
  servlet:
    session:
      cookie:
        name: SNS_SESSION
        http-only: true
        same-site: lax
