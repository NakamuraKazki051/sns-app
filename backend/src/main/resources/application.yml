spring:
  application:
    name: sns-api
  # ローカルはリポジトリ直下の docker-compose.yml の MySQL(localhost:3307)。本番は環境変数で上書きする
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/snsapp_development}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:snsapp}
  # テーブルは Flyway が db/migration の SQL で作る。Hibernate はエンティティと合っているかを確かめるだけ
  flyway:
    # Flyway を入れる前から使っている DB(テーブルはあるが履歴が無い)は、V1 まで済みとして扱う
    baseline-on-migrate: true
    baseline-version: 1
    placeholders:
      icon_data_type: MEDIUMBLOB
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  # 投稿の画像は5MBまで(アイコンの1MBは MeController が確かめる)。
  # リクエスト全体は本文とフォームの区切りなどの分だけ少し余裕を持たせる
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

# 投稿の画像の置き場所。IMAGES_S3_BUCKET があれば S3(AWS)、無ければ dir のフォルダ(ローカル)
app:
  images:
    s3-bucket: ${IMAGES_S3_BUCKET:}
    dir: ${IMAGES_DIR:data/post-images}

server:
  port: 8080
  servlet:
    session:
      cookie:
        name: SNS_SESSION
        http-only: true
        same-site: lax
