spring:
  application:
    name: sns-api
  config:
    import: classpath:springdoc.yml
  # ローカルはリポジトリ直下の docker-compose.yml の MySQL(localhost:3307)。本番は環境変数で上書きする
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/snsapp_development}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:snsapp}
  # テーブルは Flyway が db/migration の SQL で作る。Hibernate はエンティティと合っているかを確かめるだけ
  flyway:
    # Flyway を入れる前から使っている DB(テーブルはあるが履歴が無い)は、V1 まで済みとして扱う
    baseline-on-migrate: true
    baseline-version: 1
    placeholders:
      icon_data_type: MEDIUMBLOB
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  # 投稿の画像は5MBまで(アイコンの1MBは MeController が確かめる)。
  # リクエスト全体は本文とフォームの区切りなどの分だけ少し余裕を持たせる
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

# 投稿の画像の置き場所。IMAGES_S3_BUCKET があれば S3(AWS)、無ければ dir のフォルダ(ローカル)
app:
  # AWS だけで使う。CloudFront が付ける秘密のヘッダーの値(OriginSecretFilter)
  origin-secret: ${APP_ORIGIN_SECRET:}
  # 1つの IP から1時間に登録できる回数。ローカルと E2E テストでは止めない(AWS は5)
  register:
    per-hour: ${REGISTER_PER_HOUR:100000}
  # 確認メールのリンクの先。AWS は CloudFront の URL
  public-url: ${APP_PUBLIC_URL:http://localhost:5173}
  # 登録やメールアドレスの変更で、メールの確認を求めるか(負荷試験だけ false)
  email-verification:
    required: ${EMAIL_VERIFICATION_REQUIRED:true}
  # 確認メールを送る Gmail。username が空なら送らず、リンクをログに出す(ローカル)
  mail:
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
  images:
    s3-bucket: ${IMAGES_S3_BUCKET:}
    dir: ${IMAGES_DIR:data/post-images}

server:
  port: 8080
  # 画面のファイルや JSON を圧縮して送る
  compression:
    enabled: true
  tomcat:
    # 大きすぎるファイルを断るとき、これより大きいと途中で接続を切る。ブラウザが 413 を受け取れるよう、既定の2MBより広げる
    max-swallow-size: 32MB
  servlet:
    session:
      cookie:
        name: SNS_SESSION
        http-only: true
        same-site: lax
        # AWS(https)では true。ローカルは http なので false(true だとログインできない)
        secure: ${SESSION_COOKIE_SECURE:false}
