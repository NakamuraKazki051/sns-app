openapi: 3.1.0
info:
  description: |
    RaiseLine(旧Twitter風のテキストSNS)の API。

    - **ログイン：** `POST /api/auth/login` が返す Cookie(`SNS_TOKEN`、中身は JWT)で判定する
    - **エラー：** 本文は共通の `ApiError`。`message` は画面にそのまま出せる日本語
    - **他のサイトからの呼び出し：** 許可していないオリジンからの POST などは 403
    - **ページ送り：** 1ページ20件。応答の `nextCursor` を次のリクエストに渡す
  title: RaiseLine API
  version: 0.1.0
servers:
- url: /
security:
- jwtCookie: []
tags:
- description: 登録・ログイン・ログアウト
  name: 認証
- description: 投稿・タイムライン・いいね
  name: 投稿
- description: 投稿へのリプライ
  name: リプライ
- description: 他の人の投稿のリポスト
  name: リポスト
- description: ユーザーページ・検索・フォロー・メールとパスワードの変更
  name: ユーザー
- description: 表示名・自己紹介・アイコンの変更
  name: 自分の設定
- description: いいね・リプライ・リポスト・フォローの通知
  name: 通知
- description: 1対1のメッセージ
  name: DM
- description: 通報と、管理者の対応
  name: 通報
paths:
  /api/admin/reports:
    get:
      description: status=open は対応前を古い順に、resolved は対応済みを新しい順に、100件まで。管理者でなければ 404
      operationId: listReports
      parameters:
      - description: open(対応前、既定)か resolved(対応済み)
        in: query
        name: status
        required: false
        schema:
          type: string
          default: open
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReportResponse"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: ログインしていない(ログインの API では、メールアドレスかパスワードが違う)
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 見つからない(他の人の投稿やリプライを消そうとしたときも)
      summary: 通報の一覧(管理者だけ)
      tags:
      - 通報
  /api/admin/reports/{id}/resolve:
    post:
      description: DISMISSED は何もせず片付ける。POST_DELETED は通報された投稿を消し、その投稿への対応前の通報もまとめて片付ける。管理者でない・通報が無いときは
        404。投稿の通報でないのに POST_DELETED なら 400
      operationId: resolveReport
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveRequest"
        required: true
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 入力が正しくない
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: ログインしていない(ログインの API では、メールアドレスかパスワードが違う)
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 見つからない(他の人の投稿やリプライを消そうとしたときも)
      summary: 通報に対応する(管理者だけ)
      tags:
      - 通報
  /api/admin/status:
    get:
      description: 管理者なら、対応前の通報の数も返す。画面はこれを見て「通報の確認」を出す
      operationId: getAdminStatus
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStatus"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: ログインしていない(ログインの API では、メールアドレスかパスワードが違う)
      summary: 管理者かどうか
      tags:
      - 通報
  /api/auth/forgot-password:
    post:
      description: 登録の有無が分からないよう、送らなかったとき・送れなかったときも 204 を返す(メールは応答を返したあとに送るので、応答の速さも変わらない)。リンクは1時間有効。1つのアドレスにつき1時間に3回まで
      operationId: forgotPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
        required: true
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 入力が正しくない
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 回数が多すぎる。少し待ってからやり直す
      security: []
      summary: パスワード再設定のメールを送る
      tags:
      - 認証
  /api/auth/login:
    post:
      description: 成功すると Cookie が2つ付く。SNS_TOKEN(アクセストークン、JWT、15分)と SNS_REFRESH(リフレッシュトークン、7日)。1つのメールアドレスにつき5分に10回まで。2段階認証が有効な人は
        code も要る(無ければ 401 で code が TWO_FACTOR_REQUIRED)
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 入力が正しくない
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: ログインしていない(ログインの API では、メールアドレスかパスワードが違う)
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: メールアドレスの確認が済んでいない
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 回数が多すぎる。少し待ってからやり直す
      security: []
      summary: ログイン
      tags:
      - 認証
  /api/auth/logout:
    post:
      description: この端末のログインを終え、ブラウザの Cookie を消す。同じアクセストークンは期限前でも使えなくなり、リフレッシュトークンも消す。ほかの端末のログインはそのまま。ログインしていなくても
        204 を返す
      operationId: logout
      responses:
        "204":
          description: No Content
      security: []
      summary: ログアウト
      tags:
      - 認証
  /api/auth/me:
    get:
      operationId: getCurrentUser
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: ログインしていない(ログインの API では、メールアドレスかパスワードが違う)
      summary: ログイン中の自分の情報
      tags:
      - 認証
  /api/auth/refresh:
    post:
      description: Cookie SNS_REFRESH(リフレッシュトークン、7日)を新しいものと取り替え、SNS_TOKEN(アクセストークン、15分)も作り直す。取り替えたあとの古いリフレッシュトークンは使えない。30秒以上たってからもう一度使われたら、盗まれたとみなしてそのログインごと終える。30秒以内(ほかのタブが同時に作り直した)なら、何も変えずに
        204 を返す
      operationId: refreshToken
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: ログインしていない(ログインの API では、メールアドレスかパスワードが違う)
      security: []
      summary: アクセストークンを作り直す
      tags:
      - 認証
  /api/auth/register:
    post:
      description: 登録だけではログインしない。確認メールのリンクを開いたあと、ログインの API を呼ぶ。1つの IP から1時間に5回まで(入力の誤りは数えない)
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 入力が正しくない
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: メールアドレスかユーザー名が、既に使われている
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 回数が多すぎる。少し待ってからやり直す
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 確認メールを送れなかった。少し待ってからやり直す
      security: []
      summary: ユーザー登録
      tags:
      - 認証
  /api/auth/resend-verification:
    post:
      description: 登録の有無が分からないよう、送らなかったときも 204 を返す。1つのアドレスにつき1時間に3回まで
      operationId: resendVerification
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendVerificationRequest"
        required: true
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 入力が正しくない
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 回数が多すぎる。少し待ってからやり直す
      security: []
      summary: 確認メールの再送
      tags:
      - 認証
  /api/auth/reset-password:
    post:
      description: 再設定のメールのリンクに入っているトークンと、新しいパスワードを送る。トークンは1回だけ使える。すべての端末でログアウトになるので、新しいパスワードでログインし直す
      operationId: resetPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
        required: true
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 入力が正しくない
      security: []
      summary: 新しいパスワードを決める
      tags:
      - 認証
  /api/auth/verify-email:
    post:
      description: 確認メールのリンクに入っているトークンを送る。トークンは1回だけ使える
      operationId: verifyEmail
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
        required: true
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 入力が正しくない
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: メールアドレスかユーザー名が、既に使われている
      security: []
      summary: メールアドレスの確認
      tags:
      - 認証
  /api/dm:
    get:
      description: 最後のメッセージが新しい会話から50件。相手、最後のメッセージ、未読の数
      operationId: listConversations
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: ログインしていない(ログインの API では、メールアドレスかパスワードが違う)
      summary: DM の会話一覧
      tags:
      - DM
  /api/dm/messages/{id}:
    delete:
      description: 自分が送ったものだけ消せる(相手の画面からも消える)。画像も消す。他人のもの・無いものは 404
      operationId: deleteMessage
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 入力が正しくない
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: ログインしていない(ログインの API では、メールアドレスかパスワードが違う)
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 見つからない(他の人の投稿やリプライを消そうとしたときも)
      summary: DM を取り消す
      tags:
      - DM
  /api/dm/messages/{id}/image:
    get:
      description: 送った人と受け取った人だけが見られる。後から変わらないので、ブラウザに長くキャッシュさせる
      operationId: getMessageImage
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
          description: 画像
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 入力が正しくない
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: ログインしていない(ログインの API では、メールアドレスかパスワードが違う)
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 見つからない(他の人の投稿やリプライを消そうとしたときも)
      summary: DM の画像
      tags:
      - DM
  /api/dm/unread-count:
    get:
      operationId: countUnreadMessages
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadCount"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: ログインしていない(ログインの API では、メールアドレスかパスワードが違う)
      summary: 読んでいない DM の数
      tags:
      - DM
  /api/dm/{username}:
    get:
      description: 新しい順に30件。開くと、相手から届いた分は既読になる。会話を開いている間、画面が5秒ごとに最初のページを聞き直す(新着と既読を知るため)
      operationId: listMessages
      parameters:
      - in: path
        name: username
        required: true
        schema:
          type: string
      - description: 前のページの nextCursor
        in: query
        name: before
        required: false
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePage"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 入力が正しくない
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: ログインしていない(ログインの API では、メールアドレスかパスワードが違う)
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 見つからない(他の人の投稿やリプライを消そうとしたときも)
      summary: 相手との DM
      tags:
      - DM
    post:
      description: 本文は500字まで(絵文字も1字と数える)。自分には送れない(400)。1人1分に20通まで。画像を付けるときは multipart/form-data
        で image(JPEG か PNG、5MB まで)と body(空でもよい)を送る
      operationId: sendMessage
      parameters:
      - in: path
        name: username
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 入力が正しくない
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: ログインしていない(ログインの API では、メールアドレスかパスワードが違う)
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 見つからない(他の人の投稿やリプライを消そうとしたときも)
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 回数が多すぎる。少し待ってからやり直す
      summary: DM を送る
      tags:
      - DM
  /api/hashtags/{tag}/posts:
    get:
      description: "新しい順に20件。タグは # を付けずに渡す(付けてもよい)。大文字・小文字は区別しない。ブロック・ミュート中の人の投稿は出\
        さない"
      operationId: listHashtagPosts
      parameters:
      - in: path
        name: tag
        required: true
        schema:
          type: string
      - description: 前のページの nextCursor(投稿 ID)
        in: query
        name: before
        required: false
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 入力が正しくない
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: ログインしていない(ログインの API では、メールアドレスかパスワードが違う)
      summary: ハッシュタグの付いた投稿
      tags:
      - 投稿
  /api/me/blocks:
    get:
      description: 新しくブロックした順に200人まで
      operationId: listBlocks
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserSummary"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: ログインしていない(ログインの API では、メールアドレスかパスワードが違う)
      summary: ブロック中の人
      tags:
      - ユーザー
  /api/me/follow-requests:
    get:
      description: 新しい順に200人まで。ブロックしている・されている人のものは出さない
      operationId: listFollowRequests
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserSummary"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: ログインしていない(ログインの API では、メールアドレスかパスワードが違う)
      summary: 届いているフォローのリクエスト
      tags:
      - ユーザー
  /api/me/follow-requests/count:
    get:
      operationId: countFollowRequests
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestCount"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: ログインしていない(ログインの API では、メールアドレスかパスワードが違う)
      summary: 届いているフォローのリクエストの数
      tags:
      - ユーザー
  /api/me/follow-requests/{username}:
    delete:
      description: リクエストを消す。相手には知らせない(もう一度リクエストできる)。リクエストが無ければ 404
      operationId: rejectFollowRequest
      parameters:
      - in: path
        name: username
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: ログインしていない(ログインの API では、メールアドレスかパスワードが違う)
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 見つからない(他の人の投稿やリプライを消そうとしたときも)
      summary: フォローのリクエストを拒否する
      tags:
      - ユーザー
    post:
      description: 相手が自分をフォローした状態になり、自分の投稿が見えるようになる。リクエストが無ければ 404
      operationId: approveFollowRequest
      parameters:
      - in: path
        name: username
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: ログインしていない(ログインの API では、メールアドレスかパスワードが違う)
        "404":
          content:
            application/json:
