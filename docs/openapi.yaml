components:
  schemas:
    ApiError:
      properties:
        code:
          type: string
          description: 画面が出し分けに使う目印。ログインで認証アプリのコードが要るときの TWO_FACTOR_REQUIRED だけ。ほかは付かない
        message:
          type: string
          description: 画面にそのまま出せる日本語の説明
        status:
          type: integer
          format: int32
          description: HTTP ステータス
        timestamp:
          type: string
          format: date-time
    BlockResponse:
      type: object
      properties:
        blocking:
          type: boolean
    CodeRequest:
      type: object
      properties:
        code:
          type: string
          maxLength: 20
          minLength: 0
      required:
      - code
    Conversation:
      type: object
      properties:
        lastMessage:
          $ref: "#/components/schemas/MessageResponse"
        partner:
          $ref: "#/components/schemas/PublicUser"
        unreadCount:
          type: integer
          format: int64
    CreateRequest:
      type: object
      properties:
        body:
          type: string
          description: 本文。140字まで(絵文字も1字と数える)
    DeleteAccountRequest:
      type: object
      properties:
        password:
          type: string
          maxLength: 72
          minLength: 0
      required:
      - password
    DisableRequest:
      type: object
      properties:
        code:
          type: string
          maxLength: 20
          minLength: 0
        password:
          type: string
          maxLength: 72
          minLength: 0
      required:
      - code
      - password
    EditRequest:
      type: object
      properties:
        body:
          type: string
          description: 新しい本文。140字まで。画像のある投稿なら空でもよい
    FollowResponse:
      type: object
      properties:
        followersCount:
          type: integer
          format: int64
        following:
          type: boolean
    ForgotPasswordRequest:
      type: object
      properties:
        email:
          type: string
          maxLength: 255
          minLength: 0
      required:
      - email
    ImagePostForm:
      type: object
      properties:
        body:
          type: string
          description: 本文。140字まで。画像があれば空でもよい
        image:
          type: string
          format: binary
          description: JPEG か PNG、5MBまで
      required:
      - image
    ImageResponse:
      type: object
      properties:
        height:
          type: integer
          format: int32
        url:
          type: string
          description: 画像の URL。読むにはログインが要る
        width:
          type: integer
          format: int32
    LikeResponse:
      type: object
      properties:
        liked:
          type: boolean
        likesCount:
          type: integer
          format: int64
    LoginRequest:
      type: object
      properties:
        code:
          type: string
          maxLength: 20
          minLength: 0
        email:
          type: string
          maxLength: 255
          minLength: 0
        password:
          type: string
          maxLength: 72
          minLength: 0
      required:
      - email
      - password
    MessagePage:
      type: object
      properties:
        hasMore:
          type: boolean
        messages:
          type: array
          description: 新しい順
          items:
            $ref: "#/components/schemas/MessageResponse"
        nextCursor:
          type:
          - string
          - "null"
          description: 古いものを読むときに before に渡す値
    MessageResponse:
      type: object
      properties:
        body:
          type: string
        createdAt:
          type: string
          format: date-time
        id:
          type: string
          description: メッセージ ID(文字列)
        mine:
          type: boolean
          description: 自分が送ったものか
        read:
          type: boolean
          description: 受け取った人が読んだか
    MuteResponse:
      type: object
      properties:
        muting:
          type: boolean
    NewPostsResponse:
      type: object
      properties:
        count:
          type: integer
          format: int64
          description: 新着の数。100で止まる
        users:
          type: array
          description: 新着の投稿者。重複なしで3人まで
          items:
            $ref: "#/components/schemas/PublicUser"
    NotificationPage:
      type: object
      properties:
        hasMore:
          type: boolean
        nextCursor:
          type:
          - string
          - "null"
          description: 次のページを読むときに before に渡す値
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/NotificationResponse"
    NotificationResponse:
      type: object
      properties:
        actor:
          $ref: "#/components/schemas/PublicUser"
        createdAt:
          type: string
          format: date-time
        id:
          type: string
          description: 通知 ID(文字列)
        post:
          anyOf:
          - $ref: "#/components/schemas/PostSummary"
          - type: "null"
          description: どの投稿への反応か。フォローでは null
        read:
          type: boolean
        type:
          type: string
          enum:
          - LIKE
          - REPLY
          - REPOST
          - FOLLOW
    PageResponse:
      type: object
      properties:
        hasMore:
          type: boolean
        nextCursor:
          type:
          - string
          - "null"
          description: 次のページを読むときに before に渡す値。続きが無ければ null
        posts:
          type: array
          items:
            $ref: "#/components/schemas/PostResponse"
    PostResponse:
      type: object
      properties:
        body:
          type: string
        createdAt:
          type: string
          format: date-time
        editedAt:
          type:
          - string
          - "null"
          format: date-time
          description: 本文を最後に直した時刻。直していなければ null
        id:
          type: string
          description: 投稿 ID(文字列)
        image:
          anyOf:
          - $ref: "#/components/schemas/ImageResponse"
          - type: "null"
          description: 画像。無ければ null
        likedByMe:
          type: boolean
        likesCount:
          type: integer
          format: int64
        repliesCount:
          type: integer
          format: int64
        repostedBy:
          anyOf:
          - $ref: "#/components/schemas/PublicUser"
          - type: "null"
          description: リポストした人。リポストとして出すときだけ入り、それ以外は null
        repostedByMe:
          type: boolean
        repostsCount:
          type: integer
          format: int64
        user:
          $ref: "#/components/schemas/PublicUser"
    PostSummary:
      type: object
      properties:
        body:
          type: string
        id:
          type: string
          description: 投稿 ID(文字列)
    ProfileResponse:
      type: object
      properties:
        bio:
          type:
          - string
          - "null"
          description: 自己紹介。無ければ null
        blocking:
          type: boolean
          description: 自分がこの人をブロックしているか(F-20)
        createdAt:
          type: string
          format: date-time
        displayName:
          type: string
        followedByMe:
          type: boolean
        followersCount:
          type: integer
          format: int64
        followingCount:
          type: integer
          format: int64
        iconUpdatedAt:
          type:
          - string
          - "null"
          format: date-time
          description: アイコンを変えた時刻。アイコンが無ければ null
        id:
          type: string
        muting:
          type: boolean
          description: 自分がこの人をミュートしているか(F-20)
        postsCount:
          type: integer
          format: int64
        username:
          type: string
    ProfileUpdateRequest:
      type: object
      properties:
        bio:
          type: string
          description: 自己紹介。160字まで(絵文字も1字と数える)。空にすると消える
        displayName:
          type: string
          maxLength: 50
          minLength: 0
    PublicUser:
      type: object
      properties:
        displayName:
          type: string
        iconUpdatedAt:
          type:
          - string
          - "null"
          format: date-time
          description: アイコンを変えた時刻。アイコンが無ければ null
        id:
          type: string
        username:
          type: string
    RecoveryCodes:
      type: object
      properties:
        recoveryCodes:
          type: array
          description: リカバリーコード。今だけ見られる(サーバーにはハッシュしか残らない)
          items:
            type: string
    RegisterRequest:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 50
          minLength: 0
        email:
          type: string
          format: email
          maxLength: 255
          minLength: 0
        password:
          type: string
          maxLength: 72
          minLength: 8
        username:
          type: string
          minLength: 1
          pattern: "[A-Za-z0-9_]{1,15}"
      required:
      - displayName
      - email
      - password
      - username
    ReplyPage:
      type: object
      properties:
        hasMore:
          type: boolean
        replies:
          type: array
          items:
            $ref: "#/components/schemas/ReplyResponse"
    ReplyResponse:
      type: object
      properties:
        body:
          type: string
        createdAt:
          type: string
          format: date-time
        id:
          type: string
        postId:
          type: string
        user:
          $ref: "#/components/schemas/PublicUser"
    RepostResponse:
      type: object
      properties:
        reposted:
          type: boolean
        repostsCount:
          type: integer
          format: int64
    ResendVerificationRequest:
      type: object
      properties:
        email:
          type: string
          maxLength: 255
          minLength: 0
      required:
      - email
    ResetPasswordRequest:
      type: object
      properties:
        newPassword:
          type: string
          maxLength: 72
          minLength: 8
        token:
          type: string
          maxLength: 100
          minLength: 0
      required:
      - newPassword
      - token
    SendRequest:
      type: object
      properties:
        body:
          type: string
          description: 本文。500字まで(絵文字も1字と数える)
    Setup:
      type: object
      properties:
        secret:
          type: string
          description: 秘密の鍵(Base32)。QR コードを読めないときに認証アプリへ手で入れる
        uri:
          type: string
          description: 認証アプリに読ませる otpauth:// の URI。画面が QR コードにする
    Status:
      type: object
      properties:
        enabled:
          type: boolean
          description: 有効か
        recoveryCodesLeft:
          type: integer
          format: int64
          description: まだ使っていないリカバリーコードの数(無効なら0)
    Trend:
      type: object
      properties:
        postsCount:
          type: integer
          format: int64
        tag:
          type: string
    UnreadCount:
      type: object
      properties:
        count:
          type: integer
          format: int64
    UpdateRequest:
      type: object
      properties:
        currentPassword:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          description: 新しいメールアドレス。変えないなら省く
          maxLength: 255
          minLength: 0
        newPassword:
          type: string
          description: 新しいパスワード。変えないなら省く
          maxLength: 72
          minLength: 8
      required:
      - currentPassword
    UserPage:
      type: object
      properties:
        nextCursor:
          type:
          - string
          - "null"
          description: 次のページを読むときに渡す値。続きが無ければ null
        users:
          type: array
          items:
            $ref: "#/components/schemas/UserSummary"
    UserResponse:
      type: object
      properties:
        bio:
          type:
          - string
          - "null"
          description: 自己紹介。無ければ null
        createdAt:
          type: string
          format: date-time
        displayName:
          type: string
        email:
          type: string
        iconUpdatedAt:
          type:
          - string
