openapi: 3.1.0
info:
  description: |
    RaiseLine(旧Twitter風のテキストSNS)の API。

    - **ログイン：** `POST /api/auth/login` が返す Cookie(`SNS_TOKEN`、中身は JWT)で判定する
    - **エラー：** 本文は共通の `ApiError`。`message` は画面にそのまま出せる日本語
    - **他のサイトからの呼び出し：** 許可していないオリジンからの POST などは 403
    - **ページ送り：** 1ページ20件。応答の `nextCursor` を次のリクエストに渡す
  title: RaiseLine API
  version: 0.1.0
servers:
- url: /
security:
- jwtCookie: []
tags:
- description: 登録・ログイン・ログアウト
  name: 認証
- description: 投稿・タイムライン・いいね
  name: 投稿
- description: 投稿へのリプライ
  name: リプライ
- description: 他の人の投稿のリポスト
  name: リポスト
- description: ユーザーページ・検索・フォロー・メールとパスワードの変更
  name: ユーザー
- description: 表示名・自己紹介・アイコンの変更
  name: 自分の設定
- description: いいね・リプライ・リポスト・フォローの通知
  name: 通知
- description: 1対1のメッセージ
  name: DM
paths:
  /api/auth/forgot-password:
    post:
      description: 登録の有無が分からないよう、送らなかったときも 204 を返す。リンクは1時間有効。1つのアドレスにつき1時間に3回まで
      operationId: forgotPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
        required: true
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 入力が正しくない
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 回数が多すぎる。少し待ってからやり直す
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 確認メールを送れなかった。少し待ってからやり直す
      security: []
      summary: パスワード再設定のメールを送る
      tags:
      - 認証
  /api/auth/login:
    post:
      description: 成功すると Cookie(SNS_TOKEN、中身は JWT)が付く。1つのメールアドレスにつき5分に10回まで。2段階認証が有効な人は
        code も要る(無ければ 401 で code が TWO_FACTOR_REQUIRED)
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 入力が正しくない
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: ログインしていない(ログインの API では、メールアドレスかパスワードが違う)
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: メールアドレスの確認が済んでいない
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 回数が多すぎる。少し待ってからやり直す
      security: []
      summary: ログイン
      tags:
      - 認証
  /api/auth/logout:
    post:
      description: この端末のログインを終え、ブラウザの Cookie を消す。同じ JWT は期限前でも使えなくなる。ほかの端末のログインはそのまま。ログインしていなくても
        204 を返す
      operationId: logout
      responses:
        "204":
          description: No Content
      security: []
      summary: ログアウト
      tags:
      - 認証
  /api/auth/me:
    get:
      operationId: getCurrentUser
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: ログインしていない(ログインの API では、メールアドレスかパスワードが違う)
      summary: ログイン中の自分の情報
      tags:
      - 認証
  /api/auth/register:
    post:
      description: 登録だけではログインしない。確認メールのリンクを開いたあと、ログインの API を呼ぶ。1つの IP から1時間に5回まで(入力の誤りは数えない)
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 入力が正しくない
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: メールアドレスかユーザー名が、既に使われている
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 回数が多すぎる。少し待ってからやり直す
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 確認メールを送れなかった。少し待ってからやり直す
      security: []
      summary: ユーザー登録
      tags:
      - 認証
  /api/auth/resend-verification:
    post:
      description: 登録の有無が分からないよう、送らなかったときも 204 を返す。1つのアドレスにつき1時間に3回まで
      operationId: resendVerification
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendVerificationRequest"
        required: true
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 入力が正しくない
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 回数が多すぎる。少し待ってからやり直す
      security: []
      summary: 確認メールの再送
      tags:
      - 認証
  /api/auth/reset-password:
    post:
      description: 再設定のメールのリンクに入っているトークンと、新しいパスワードを送る。トークンは1回だけ使える。すべての端末でログアウトになるので、新しいパスワードでログインし直す
      operationId: resetPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
        required: true
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 入力が正しくない
      security: []
      summary: 新しいパスワードを決める
      tags:
      - 認証
  /api/auth/verify-email:
    post:
      description: 確認メールのリンクに入っているトークンを送る。トークンは1回だけ使える
      operationId: verifyEmail
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
        required: true
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 入力が正しくない
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: メールアドレスかユーザー名が、既に使われている
      security: []
      summary: メールアドレスの確認
      tags:
      - 認証
  /api/dm:
    get:
      description: 最後のメッセージが新しい会話から50件。相手、最後のメッセージ、未読の数
      operationId: listConversations
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: ログインしていない(ログインの API では、メールアドレスかパスワードが違う)
      summary: DM の会話一覧
      tags:
      - DM
  /api/dm/unread-count:
    get:
      operationId: countUnreadMessages
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadCount"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: ログインしていない(ログインの API では、メールアドレスかパスワードが違う)
      summary: 読んでいない DM の数
      tags:
      - DM
  /api/dm/{username}:
    get:
      description: 新しい順に30件。開くと、相手から届いた分は既読になる。会話を開いている間、画面が5秒ごとに最初のページを聞き直す(新着と既読を知るため)
      operationId: listMessages
      parameters:
      - in: path
        name: username
        required: true
        schema:
          type: string
      - description: 前のページの nextCursor
        in: query
        name: before
        required: false
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePage"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 入力が正しくない
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: ログインしていない(ログインの API では、メールアドレスかパスワードが違う)
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 見つからない(他の人の投稿やリプライを消そうとしたときも)
      summary: 相手との DM
      tags:
      - DM
    post:
      description: 本文は500字まで(絵文字も1字と数える)。自分には送れない(400)。1人1分に20通まで
      operationId: sendMessage
      parameters:
      - in: path
        name: username
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 入力が正しくない
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: ログインしていない(ログインの API では、メールアドレスかパスワードが違う)
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 見つからない(他の人の投稿やリプライを消そうとしたときも)
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 回数が多すぎる。少し待ってからやり直す
      summary: DM を送る
      tags:
      - DM
  /api/hashtags/{tag}/posts:
    get:
      description: "新しい順に20件。タグは # を付けずに渡す(付けてもよい)。大文字・小文字は区別しない。ブロック・ミュート中の人の投稿は出\
        さない"
      operationId: listHashtagPosts
      parameters:
      - in: path
        name: tag
        required: true
        schema:
          type: string
      - description: 前のページの nextCursor(投稿 ID)
        in: query
        name: before
        required: false
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 入力が正しくない
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: ログインしていない(ログインの API では、メールアドレスかパスワードが違う)
      summary: ハッシュタグの付いた投稿
      tags:
      - 投稿
  /api/me/blocks:
    get:
      description: 新しくブロックした順に200人まで
      operationId: listBlocks
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserSummary"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: ログインしていない(ログインの API では、メールアドレスかパスワードが違う)
      summary: ブロック中の人
      tags:
      - ユーザー
  /api/me/icon:
    delete:
      description: 表示名の頭文字の丸に戻る
      operationId: deleteIcon
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: ログインしていない(ログインの API では、メールアドレスかパスワードが違う)
      summary: アイコンを外す
      tags:
      - 自分の設定
    put:
      description: JPEG か PNG、1MBまで
      operationId: putIcon
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                icon:
                  type: string
                  format: binary
              required:
              - icon
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 入力が正しくない
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: ログインしていない(ログインの API では、メールアドレスかパスワードが違う)
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: ファイルが大きすぎる
      summary: アイコンを変える
      tags:
      - 自分の設定
  /api/me/mutes:
    get:
      description: 新しくミュートした順に200人まで
      operationId: listMutes
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserSummary"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: ログインしていない(ログインの API では、メールアドレスかパスワードが違う)
      summary: ミュート中の人
      tags:
      - ユーザー
  /api/me/profile:
    patch:
      description: 送った項目だけ変える。表示名は50字まで。自己紹介は160字まで(絵文字も1字と数える)で、空にすると消える
      operationId: updateProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdateRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 入力が正しくない
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: ログインしていない(ログインの API では、メールアドレスかパスワードが違う)
      summary: 表示名と自己紹介を変える
      tags:
      - 自分の設定
  /api/me/two-factor:
    delete:
      description: パスワードと、認証アプリのコード(かまだ使っていないリカバリーコード)が要る。リカバリーコードも消す。1人5分に10回まで
      operationId: disableTwoFactor
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisableRequest"
        required: true
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 入力が正しくない
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: ログインしていない(ログインの API では、メールアドレスかパスワードが違う)
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: メールアドレスかユーザー名が、既に使われている
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 回数が多すぎる。少し待ってからやり直す
      summary: 2段階認証を外す
      tags:
      - 自分の設定
    get:
      operationId: getTwoFactor
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: ログインしていない(ログインの API では、メールアドレスかパスワードが違う)
      summary: 2段階認証の状態
      tags:
      - 自分の設定
  /api/me/two-factor/enable:
    post:
      description: 設定を始めたあと、認証アプリに出た6桁のコードを送る。合えば有効にし、リカバリーコード10個を返す(今だけ見られる)。1人5分に10回まで
      operationId: enableTwoFactor
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodes"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 入力が正しくない
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: ログインしていない(ログインの API では、メールアドレスかパスワードが違う)
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: メールアドレスかユーザー名が、既に使われている
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 回数が多すぎる。少し待ってからやり直す
      summary: 2段階認証を有効にする
      tags:
      - 自分の設定
  /api/me/two-factor/recovery-codes:
    post:
      description: 認証アプリのコード(かまだ使っていないリカバリーコード)が要る。前のリカバリーコードは使えなくなる。1人5分に10回まで
      operationId: regenerateRecoveryCodes
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodes"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 入力が正しくない
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: ログインしていない(ログインの API では、メールアドレスかパスワードが違う)
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: メールアドレスかユーザー名が、既に使われている
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 回数が多すぎる。少し待ってからやり直す
      summary: リカバリーコードを作り直す
      tags:
      - 自分の設定
  /api/me/two-factor/setup:
    post:
      description: 新しい秘密の鍵を作って返す。まだ有効にはならない(有効にする API にコードを送ったとき有効になる)。もう有効なら 409
      operationId: setupTwoFactor
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Setup"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: ログインしていない(ログインの API では、メールアドレスかパスワードが違う)
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: メールアドレスかユーザー名が、既に使われている
      summary: 2段階認証の設定を始める
      tags:
      - 自分の設定
  /api/notifications:
    get:
      description: 新しい順に20件。ブロック・ミュート中の人からのものは出さない
      operationId: listNotifications
      parameters:
      - description: 前のページの nextCursor
        in: query
        name: before
        required: false
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPage"
          description: OK
        "400":
          content:
            application/json:
