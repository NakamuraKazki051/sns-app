          description: 見つからない(他の人の投稿やリプライを消そうとしたときも)
      summary: アイコン画像
      tags:
      - ユーザー
  /api/users/{username}/mute:
    delete:
      operationId: unmute
      parameters:
      - in: path
        name: username
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MuteResponse"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: ログインしていない(ログインの API では、メールアドレスかパスワードが違う)
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 見つからない(他の人の投稿やリプライを消そうとしたときも)
      summary: ミュートを解除する
      tags:
      - ユーザー
    post:
      description: 自分のタイムライン・新着・リプライ一覧に出なくなる。相手には分からない。自分はミュートできない(400)
      operationId: mute
      parameters:
      - in: path
        name: username
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MuteResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 入力が正しくない
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: ログインしていない(ログインの API では、メールアドレスかパスワードが違う)
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 見つからない(他の人の投稿やリプライを消そうとしたときも)
      summary: ミュートする
      tags:
      - ユーザー
  /api/users/{username}/posts:
    get:
      description: 新しい順に20件
      operationId: listUserPosts
      parameters:
      - in: path
        name: username
        required: true
        schema:
          type: string
      - description: 前のページの nextCursor。形式は 投稿ID:リポストID(どちらかが空のこともある)
        in: query
        name: before
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 入力が正しくない
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: ログインしていない(ログインの API では、メールアドレスかパスワードが違う)
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: 見つからない(他の人の投稿やリプライを消そうとしたときも)
      summary: その人の投稿とリポスト
      tags:
      - ユーザー
components:
  schemas:
    AdminStatus:
      type: object
      properties:
        admin:
          type: boolean
        openReports:
          type: integer
          format: int64
      required:
      - admin
      - openReports
    ApiError:
      properties:
        code:
          type: string
          description: 画面が出し分けに使う目印。ログインで認証アプリのコードが要るときの TWO_FACTOR_REQUIRED だけ。ほかは付かない
        message:
          type: string
          description: 画面にそのまま出せる日本語の説明
        status:
          type: integer
          format: int32
          description: HTTP ステータス
        timestamp:
          type: string
          format: date-time
      required:
      - message
      - status
      - timestamp
    BlockResponse:
      type: object
      properties:
        blocking:
          type: boolean
      required:
      - blocking
    CodeRequest:
      type: object
      properties:
        code:
          type: string
          maxLength: 20
          minLength: 0
      required:
      - code
    Conversation:
      type: object
      properties:
        lastMessage:
          $ref: "#/components/schemas/MessageResponse"
        partner:
          $ref: "#/components/schemas/PublicUser"
        unreadCount:
          type: integer
          format: int64
      required:
      - lastMessage
      - partner
      - unreadCount
    CreateRequest:
      type: object
      properties:
        body:
          type: string
          description: 本文。140字まで(絵文字も1字と数える)
    DeleteAccountRequest:
      type: object
      properties:
        password:
          type: string
          maxLength: 72
          minLength: 0
      required:
      - password
    DisableRequest:
      type: object
      properties:
        code:
          type: string
          maxLength: 20
          minLength: 0
        password:
          type: string
          maxLength: 72
          minLength: 0
      required:
      - code
      - password
    EditRequest:
      type: object
      properties:
        body:
          type: string
          description: 新しい本文。140字まで。画像のある投稿なら空でもよい
    FollowResponse:
      type: object
      properties:
        followersCount:
          type: integer
          format: int64
        following:
          type: boolean
        requested:
          type: boolean
          description: 鍵アカウントへのリクエストを送って承認を待っているか(F-26)
      required:
      - followersCount
      - following
      - requested
    ForgotPasswordRequest:
      type: object
      properties:
        email:
          type: string
          maxLength: 255
          minLength: 0
      required:
      - email
    ImagePostForm:
      type: object
      properties:
        body:
          type: string
          description: 本文。140字まで。画像があれば空でもよい
        image:
          type: string
          format: binary
          description: JPEG か PNG、5MBまで
      required:
      - image
    ImageResponse:
      type: object
      properties:
        height:
          type: integer
          format: int32
        url:
          type: string
          description: 画像の URL。読むにはログインが要る
        width:
          type: integer
          format: int32
      required:
      - height
      - url
      - width
    LikeResponse:
      type: object
      properties:
        liked:
          type: boolean
        likesCount:
          type: integer
          format: int64
      required:
      - liked
      - likesCount
    LoginRequest:
      type: object
      properties:
        code:
          type: string
          maxLength: 20
          minLength: 0
        email:
          type: string
          maxLength: 255
          minLength: 0
        password:
          type: string
          maxLength: 72
          minLength: 0
      required:
      - email
      - password
    MessagePage:
      type: object
      properties:
        hasMore:
          type: boolean
        messages:
          type: array
          description: 新しい順
          items:
            $ref: "#/components/schemas/MessageResponse"
        nextCursor:
          type:
          - string
          - "null"
          description: 古いものを読むときに before に渡す値
      required:
      - hasMore
      - messages
      - nextCursor
    MessageResponse:
      type: object
      properties:
        body:
          type: string
          description: 本文。画像だけのメッセージなら空
        createdAt:
          type: string
          format: date-time
        id:
          type: string
          description: メッセージ ID(文字列)
        image:
          anyOf:
          - $ref: "#/components/schemas/ImageResponse"
          - type: "null"
          description: 画像。無ければ null
        mine:
          type: boolean
          description: 自分が送ったものか
        read:
          type: boolean
          description: 受け取った人が読んだか
      required:
      - body
      - createdAt
      - id
      - image
      - mine
      - read
    MuteResponse:
      type: object
      properties:
        muting:
          type: boolean
      required:
      - muting
    NewPostsResponse:
      type: object
      properties:
        count:
          type: integer
          format: int64
          description: 新着の数。100で止まる
        users:
          type: array
          description: 新着の投稿者。重複なしで3人まで
          items:
            $ref: "#/components/schemas/PublicUser"
      required:
      - count
      - users
    NotificationPage:
      type: object
      properties:
        hasMore:
          type: boolean
        nextCursor:
          type:
          - string
          - "null"
          description: 次のページを読むときに before に渡す値
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/NotificationResponse"
      required:
      - hasMore
      - nextCursor
      - notifications
    NotificationResponse:
      type: object
      properties:
        actor:
          $ref: "#/components/schemas/PublicUser"
        createdAt:
          type: string
          format: date-time
        id:
          type: string
          description: 通知 ID(文字列)
        post:
          anyOf:
          - $ref: "#/components/schemas/PostSummary"
          - type: "null"
          description: どの投稿への反応か。フォローとフォローのリクエストでは null
        read:
          type: boolean
        type:
          type: string
          description: 種類。FOLLOW_REQUEST は鍵アカウントへのフォローのリクエスト
          enum:
          - LIKE
          - REPLY
          - REPOST
          - FOLLOW
          - FOLLOW_REQUEST
      required:
      - actor
      - createdAt
      - id
      - post
      - read
      - type
    PageResponse:
      type: object
      properties:
        hasMore:
          type: boolean
        nextCursor:
          type:
          - string
          - "null"
          description: 次のページを読むときに before に渡す値。続きが無ければ null
        posts:
          type: array
          items:
            $ref: "#/components/schemas/PostResponse"
      required:
      - hasMore
      - nextCursor
      - posts
    PostResponse:
      type: object
      properties:
        body:
          type: string
        createdAt:
          type: string
          format: date-time
        editedAt:
          type:
          - string
          - "null"
          format: date-time
          description: 本文を最後に直した時刻。直していなければ null
        id:
          type: string
          description: 投稿 ID(文字列)
        image:
          anyOf:
          - $ref: "#/components/schemas/ImageResponse"
          - type: "null"
          description: 画像。無ければ null
        likedByMe:
          type: boolean
        likesCount:
          type: integer
          format: int64
        repliesCount:
          type: integer
          format: int64
        repostedBy:
          anyOf:
          - $ref: "#/components/schemas/PublicUser"
          - type: "null"
          description: リポストした人。リポストとして出すときだけ入り、それ以外は null
        repostedByMe:
          type: boolean
        repostsCount:
          type: integer
          format: int64
        user:
          $ref: "#/components/schemas/PublicUser"
      required:
      - body
      - createdAt
      - editedAt
      - id
      - image
      - likedByMe
      - likesCount
      - repliesCount
      - repostedBy
      - repostedByMe
      - repostsCount
      - user
    PostSummary:
      type: object
      properties:
        body:
          type: string
        id:
          type: string
          description: 投稿 ID(文字列)
      required:
      - body
      - id
    ProfileResponse:
      type: object
      properties:
        bio:
          type:
          - string
          - "null"
          description: 自己紹介。無ければ null
        blocking:
          type: boolean
          description: 自分がこの人をブロックしているか(F-20)
        canViewPosts:
          type: boolean
          description: 自分がこの人の投稿・フォロー一覧を見られるか。鍵アカウントで、フォローしていなければ false
        createdAt:
          type: string
          format: date-time
        displayName:
          type: string
        followRequested:
          type: boolean
          description: 自分がフォローのリクエストを送って、承認を待っているか(F-26)
        followedByMe:
          type: boolean
        followersCount:
          type: integer
          format: int64
        followingCount:
          type: integer
          format: int64
        iconUpdatedAt:
          type:
          - string
          - "null"
          format: date-time
          description: アイコンを変えた時刻。アイコンが無ければ null
        id:
          type: string
        muting:
          type: boolean
          description: 自分がこの人をミュートしているか(F-20)
        postsCount:
          type: integer
          format: int64
        privateAccount:
          type: boolean
          description: 鍵アカウントか(F-26)
        username:
          type: string
      required:
      - bio
      - blocking
      - canViewPosts
      - createdAt
      - displayName
      - followRequested
      - followedByMe
      - followersCount
      - followingCount
      - iconUpdatedAt
      - id
      - muting
      - postsCount
      - privateAccount
      - username
    ProfileUpdateRequest:
      type: object
      properties:
        bio:
          type: string
          description: 自己紹介。160字まで(絵文字も1字と数える)。空にすると消える
        displayName:
          type: string
          maxLength: 50
          minLength: 0
        privateAccount:
          type: boolean
          description: 鍵アカウントにするか(F-26)。外すと、届いているフォローのリクエストはすべて承認する
    PublicUser:
      type: object
      properties:
        displayName:
          type: string
        iconUpdatedAt:
          type:
          - string
          - "null"
          format: date-time
          description: アイコンを変えた時刻。アイコンが無ければ null
        id:
          type: string
        username:
          type: string
      required:
      - displayName
      - iconUpdatedAt
      - id
      - username
    RecommendedUser:
      type: object
      properties:
        bio:
          type:
          - string
          - "null"
        displayName:
          type: string
        iconUpdatedAt:
          type:
          - string
          - "null"
          format: date-time
        id:
          type: string
        mutualCount:
          type: integer
          format: int64
          description: FOLLOWED_BY_FOLLOWING なら、その人をフォローしているフォロー中の人の数
        reason:
          type: string
          description: おすすめの理由
          enum:
          - FOLLOWED_BY_FOLLOWING
          - POPULAR
          - NEW
        username:
          type: string
      required:
      - bio
      - displayName
      - iconUpdatedAt
      - id
      - mutualCount
      - reason
      - username
    RecoveryCodes:
      type: object
      properties:
        recoveryCodes:
          type: array
          description: リカバリーコード。今だけ見られる(サーバーにはハッシュしか残らない)
          items:
            type: string
      required:
      - recoveryCodes
    RegisterRequest:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 50
          minLength: 0
        email:
          type: string
          format: email
          maxLength: 255
          minLength: 0
        password:
          type: string
          maxLength: 72
          minLength: 8
        username:
          type: string
          minLength: 1
          pattern: "[A-Za-z0-9_]{1,15}"
      required:
      - displayName
      - email
      - password
      - username
    ReplyPage:
      type: object
      properties:
        hasMore:
          type: boolean
        replies:
          type: array
          items:
            $ref: "#/components/schemas/ReplyResponse"
      required:
      - hasMore
      - replies
    ReplyResponse:
      type: object
      properties:
        body:
          type: string
        createdAt:
          type: string
          format: date-time
        id:
          type: string
        postId:
          type: string
        user:
          $ref: "#/components/schemas/PublicUser"
      required:
      - body
      - createdAt
      - id
      - postId
      - user
    ReportRequest:
      type: object
      properties:
        detail:
          type: string
          description: 詳しい説明(任意、500字まで)
        postId:
          type: string
          description: 通報する投稿の ID(文字列)。ユーザーの通報なら省く
        reason:
          type: string
          description: 理由
          enum:
          - SPAM
          - HARASSMENT
          - INAPPROPRIATE
          - IMPERSONATION
          - OTHER
        username:
          type: string
          description: 通報するユーザー名。投稿の通報なら省いてよい
    ReportResponse:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        detail:
          type:
          - string
          - "null"
        id:
          type: string
          description: 通報 ID(文字列)
        post:
          anyOf:
          - $ref: "#/components/schemas/ReportedPost"
          - type: "null"
          description: 投稿の通報なら入る
        reason:
          type: string
          enum:
          - SPAM
          - HARASSMENT
          - INAPPROPRIATE
          - IMPERSONATION
          - OTHER
        reporter:
          $ref: "#/components/schemas/PublicUser"
        resolution:
          type:
          - string
          - "null"
          enum:
          - DISMISSED
          - POST_DELETED
        resolvedAt:
          type:
          - string
          - "null"
          format: date-time
        target:
          $ref: "#/components/schemas/PublicUser"
      required:
      - createdAt
      - detail
      - id
      - post
      - reason
      - reporter
      - resolution
      - resolvedAt
      - target
    ReportedPost:
      type: object
      properties:
        body:
          type: string
          description: 通報した時点の本文
        id:
          type:
          - string
          - "null"
          description: 投稿 ID。投稿が消されていれば null
      required:
      - body
      - id
    RepostResponse:
      type: object
      properties:
        reposted:
          type: boolean
        repostsCount:
          type: integer
          format: int64
      required:
      - reposted
      - repostsCount
    RequestCount:
      type: object
      properties:
        count:
          type: integer
          format: int64
      required:
      - count
    ResendVerificationRequest:
      type: object
      properties:
        email:
          type: string
          maxLength: 255
          minLength: 0
      required:
      - email
    ResetPasswordRequest:
      type: object
      properties:
        newPassword:
          type: string
          maxLength: 72
          minLength: 8
        token:
          type: string
          maxLength: 100
          minLength: 0
      required:
      - newPassword
      - token
    ResolveRequest:
      type: object
      properties:
        resolution:
          type: string
          description: DISMISSED(問題なし)か POST_DELETED(投稿を消す)
          enum:
          - DISMISSED
          - POST_DELETED
    SendRequest:
      type: object
      properties:
        body:
          type: string
          description: 本文。500字まで(絵文字も1字と数える)
    SessionResponse:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        current:
          type: boolean
        device:
          type: string
        id:
          type: string
        lastUsedAt:
          type: string
          format: date-time
      required:
      - createdAt
      - current
      - device
      - id
      - lastUsedAt
    Setup:
      type: object
      properties:
        secret:
          type: string
          description: 秘密の鍵(Base32)。QR コードを読めないときに認証アプリへ手で入れる
        uri:
          type: string
          description: 認証アプリに読ませる otpauth:// の URI。画面が QR コードにする
      required:
      - secret
      - uri
    Status:
      type: object
      properties:
        enabled:
          type: boolean
          description: 有効か
        recoveryCodesLeft:
          type: integer
          format: int64
          description: まだ使っていないリカバリーコードの数(無効なら0)
      required:
      - enabled
      - recoveryCodesLeft
    Trend:
      type: object
      properties:
        postsCount:
          type: integer
          format: int64
        tag:
          type: string
      required:
      - postsCount
      - tag
    UnreadCount:
      type: object
      properties:
        count:
          type: integer
          format: int64
      required:
      - count
    UpdateRequest:
      type: object
      properties:
        currentPassword:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          description: 新しいメールアドレス。変えないなら省く
          maxLength: 255
          minLength: 0
        newPassword:
          type: string
          description: 新しいパスワード。変えないなら省く
          maxLength: 72
          minLength: 8
      required:
      - currentPassword
    UserPage:
      type: object
      properties:
        nextCursor:
          type:
          - string
          - "null"
          description: 次のページを読むときに渡す値。続きが無ければ null
        users:
          type: array
          items:
            $ref: "#/components/schemas/UserSummary"
      required:
      - nextCursor
      - users
    UserResponse:
      type: object
      properties:
        bio:
          type:
          - string
          - "null"
          description: 自己紹介。無ければ null
        createdAt:
          type: string
          format: date-time
        displayName:
          type: string
        email:
          type: string
        iconUpdatedAt:
          type:
          - string
          - "null"
          format: date-time
          description: アイコンを変えた時刻。アイコンが無ければ null
        id:
          type: string
        privateAccount:
          type: boolean
          description: 鍵アカウントか(F-26)
        username:
          type: string
      required:
      - bio
      - createdAt
      - displayName
      - email
      - iconUpdatedAt
      - id
      - privateAccount
      - username
    UserSummary:
      type: object
      properties:
        bio:
          type:
          - string
          - "null"
          description: 自己紹介。無ければ null
        displayName:
          type: string
        iconUpdatedAt:
          type:
          - string
          - "null"
          format: date-time
          description: アイコンを変えた時刻。アイコンが無ければ null
        id:
          type: string
        username:
          type: string
      required:
      - bio
      - displayName
      - iconUpdatedAt
      - id
      - username
    VerifyEmailRequest:
      type: object
      properties:
        token:
          type: string
          maxLength: 100
          minLength: 0
      required:
      - token
  securitySchemes:
    jwtCookie:
      description: ログインすると付く Cookie(中身は JWT、有効期限は最後の操作から30分)。Swagger UI では、ログインの API
        を試すと自動で付く
      in: cookie
      name: SNS_TOKEN
      type: apiKey
