# PR と master への push のたびに、API・画面・結合のテストを自動で動かす
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API のテスト
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: mvn -B test
        working-directory: backend

  frontend:
    name: 画面のテスト
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  integration:
    name: 結合テスト
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: snsapp
          MYSQL_DATABASE: snsapp_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -psnsapp --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      E2E_BASE_URL: http://localhost:8082
      E2E_APP_LOG: ${{ github.workspace }}/e2e/app.log
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: 画面をビルド
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: jar をビルド
        working-directory: backend
        run: mvn -B package -DskipTests
      - name: アプリを起動
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/snsapp_e2e
          APP_PUBLIC_URL: http://localhost:8082
          IMAGES_DIR: ${{ runner.temp }}/e2e-images
        run: |
          nohup java -jar backend/target/sns-api-0.1.0.jar --server.port=8082 > e2e/app.log 2>&1 &
          for i in $(seq 1 60); do
            curl -s -o /dev/null http://localhost:8082/api/auth/me && exit 0
            sleep 2
          done
          cat e2e/app.log
          exit 1
      - name: 結合テスト
        working-directory: e2e
        run: |
          npm ci
          npx playwright test
      - name: 失敗の記録を残す
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
            e2e/app.log
          retention-days: 7
